resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 2s;

map $request_uri $ui_access_loggable {
  ~^/api/ 0;
  default 1;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;

  set $app_upstream http://app:8080;
  client_max_body_size 16k;
  server_tokens off;

  access_log /dev/stdout combined if=$ui_access_loggable;
  error_log /dev/stderr warn;

  include /etc/nginx/includes/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ^~ /api/ {
    include /etc/nginx/includes/proxy-params.conf;
  }

  location = /actuator/health/liveness {
    include /etc/nginx/includes/proxy-params.conf;
  }

  location = /actuator/health/readiness {
    include /etc/nginx/includes/proxy-params.conf;
  }

  location = / {
    return 302 /console;
  }

  location = /console {
    try_files /console/index.html =404;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/includes/security-headers.conf;
  }

  location = /console/index.html {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/includes/security-headers.conf;
  }

  location ^~ /console/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/includes/security-headers.conf;
  }

  location ^~ /console/ {
    try_files $uri $uri/ /console/index.html;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/includes/security-headers.conf;
  }

  location / {
    return 404;
  }
}
