name: Benchmark

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Bounded benchmark scenario
        required: true
        default: strict-hot-key
        type: choice
        options: [strict-hot-key, leased-hot-key, mixed-80-20, algorithms, high-cardinality]
      rps:
        description: Offered requests per second (1..100000)
        required: true
        default: "100"
        type: string
      duration:
        description: Duration such as 30s or 2m
        required: true
        default: 30s
        type: string
      policy:
        description: Trusted benchmark policy ID
        required: true
        default: benchmark-token-strict
        type: choice
        options: [benchmark-token-strict, benchmark-token-leased, benchmark-log-strict, benchmark-log-leased, benchmark-counter-strict, benchmark-counter-leased]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: rate-limiter-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
      SCENARIO: ${{ inputs.scenario }}
      RPS: ${{ inputs.rps }}
      DURATION: ${{ inputs.duration }}
      POLICY_ID: ${{ inputs.policy }}
      VUS: "100"
      KEY_CARDINALITY: "1000"
      SPRING_PROFILES_ACTIVE: demo,benchmark
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate bounded inputs
        shell: bash
        run: |
          case "$SCENARIO" in strict-hot-key|leased-hot-key|mixed-80-20|algorithms|high-cardinality) ;; *) exit 2;; esac
          case "$POLICY_ID" in benchmark-token-strict|benchmark-token-leased|benchmark-log-strict|benchmark-log-leased|benchmark-counter-strict|benchmark-counter-leased) ;; *) exit 2;; esac
          case "$SCENARIO:$POLICY_ID" in
            strict-hot-key:*-strict|leased-hot-key:*-leased|mixed-80-20:*|high-cardinality:*|algorithms:benchmark-token-strict) ;;
            *) exit 2;;
          esac
          if ! [[ "$RPS" =~ ^[1-9][0-9]{0,5}$ ]] || ((RPS > 100000)); then exit 2; fi
          if ! [[ "$DURATION" =~ ^[1-9][0-9]{0,3}(s|m)$ ]]; then exit 2; fi
      - name: Start benchmark profile
        run: docker compose up --build -d
      - name: Wait for readiness
        run: |
          for _attempt in {1..90}; do
            curl --fail --silent http://localhost:8080/actuator/health/readiness >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Run k6
        run: ./scripts/benchmark.sh
      - name: Record environment metadata
        if: always()
        run: |
          mkdir -p build/results
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(date -u +%FT%TZ)"
            echo "os=$(uname -a)"
            echo "cpu=$(nproc)"
            echo "memory_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
            docker version --format 'docker_client={{.Client.Version}} docker_server={{.Server.Version}}'
            docker compose exec -T redis redis-server --version
            docker compose exec -T app java -version 2>&1
          } > build/results/environment.txt
      - name: Capture logs on failure
        if: failure()
        run: docker compose logs --no-color > build/results/compose-benchmark.log 2>&1 || true
      - name: Upload real benchmark output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: build/results/**
      - name: Tear down task-owned stack
        if: always()
        run: docker compose down -v --remove-orphans
